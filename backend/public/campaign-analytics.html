<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campaign Analytics — TredevaAstro</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f4ee; color: #2a2118; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  h2.section-title { font-size: 1.05rem; margin: 2rem 0 0.75rem; }
  .sub { color: #7a6f5d; font-size: 0.9rem; margin: 0 0 1.5rem; }
  .gate { max-width: 360px; margin: 3rem auto; background: #fff; border: 1px solid #e4dccb; border-radius: 12px; padding: 1.75rem; text-align: center; }
  .gate input { width: 100%; padding: 0.65rem 0.75rem; border: 1px solid #d8cdb6; border-radius: 8px; font-size: 1rem; margin: 1rem 0 0.75rem; }
  .pw-field { position: relative; margin: 1rem 0 0.75rem; }
  .pw-field input { padding-right: 2.5rem; margin: 0; }
  .pw-toggle { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0.25rem; line-height: 1; opacity: 0.6; }
  .pw-toggle:hover { opacity: 1; background: none; }
  button { background: #b58a3b; color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.1rem; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  button:hover { background: #9c7530; }
  button.secondary { background: #fff; color: #2a2118; border: 1px solid #d8cdb6; }
  button.secondary:hover { background: #f0ead9; }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #a5301f; }
  .error { color: #c0392b; font-size: 0.85rem; margin: 0.25rem 0 0; min-height: 1.2em; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .toolbar-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .group { background: #fff; border: 1px solid #e4dccb; border-radius: 12px; margin-bottom: 1.25rem; overflow: hidden; }
  .group h2 { font-size: 1rem; margin: 0; padding: 0.9rem 1.1rem; background: #efe7d4; border-bottom: 1px solid #e4dccb; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.7rem 1.1rem; border-bottom: 1px solid #f0ead9; font-size: 0.92rem; }
  .row:last-child { border-bottom: none; }
  .row .label { word-break: break-word; }
  .row .bar-wrap { grid-column: 1 / -1; height: 6px; background: #f0ead9; border-radius: 3px; overflow: hidden; margin-top: -0.3rem; }
  .row .bar { height: 100%; background: #b58a3b; }
  .count { font-weight: 700; text-align: right; min-width: 3.5em; }
  .count.small { font-weight: 400; color: #7a6f5d; }
  .empty { color: #7a6f5d; padding: 2rem; text-align: center; }
  .table-scroll { overflow-x: auto; background: #fff; border: 1px solid #e4dccb; border-radius: 12px; }
  table.users { border-collapse: collapse; width: 100%; font-size: 0.85rem; white-space: nowrap; }
  table.users th, table.users td { padding: 0.55rem 0.8rem; border-bottom: 1px solid #f0ead9; text-align: left; }
  table.users th { background: #efe7d4; position: sticky; top: 0; }
  table.users th.feature, table.users td.feature { text-align: center; }
  table.users tbody tr:hover { background: #faf6ec; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="gate">
      <h1>Campaign Analytics</h1>
      <p class="sub">Enter the dashboard ID and password to continue.</p>
      <input id="username" type="text" placeholder="ID" autofocus autocomplete="username" />
      <div class="pw-field">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="button" id="toggle-password" class="pw-toggle" aria-label="Show password">👁</button>
      </div>
      <div><button id="unlock">View Dashboard</button></div>
      <p class="error" id="gate-error"></p>
    </div>

    <div id="dashboard" hidden>
      <div class="toolbar">
        <div>
          <h1>Campaign Analytics</h1>
          <p class="sub">What visitors clicked on the Ganesh Chaturthi campaign site.</p>
        </div>
        <div class="toolbar-actions">
          <button id="refresh" class="secondary">↻ Refresh</button>
          <button id="download-csv" class="secondary">⬇ Download CSV</button>
          <button id="reset" class="danger">⚠ Reset All Data</button>
        </div>
      </div>
      <p class="error" id="action-error"></p>

      <div id="content"></div>

      <h2 class="section-title">Users &amp; Their Feature Usage</h2>
      <div id="users-content"></div>
    </div>
  </div>

<script>
  const API_BASE = window.location.origin;
  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const gateError = document.getElementById('gate-error');
  const actionError = document.getElementById('action-error');
  const content = document.getElementById('content');
  const usersContent = document.getElementById('users-content');

  function getStoredCredentials() {
    return { username: sessionStorage.getItem('campaign_analytics_user') || '', password: sessionStorage.getItem('campaign_analytics_pw') || '' };
  }
  function storeCredentials(username, pw) {
    sessionStorage.setItem('campaign_analytics_user', username);
    sessionStorage.setItem('campaign_analytics_pw', pw);
  }

  const EVENT_TYPE_LABELS = {
    tool_open: 'Calculator Tools Opened',
    wish_modal_open: '"Customize Your Wishes" Opened',
    wish_template_chosen: 'Wish Template Chosen',
    wish_photo_added: 'Wish Photo Added',
    wish_share: 'Wish Card Shared',
    wish_download: 'Wish Card Downloaded',
  };

  // Every calculator the campaign site offers (ganesh-chaturthi/src/data/tools.tsx,
  // kept in sync with that list by hand) — shown here even with zero opens so
  // the dashboard always lists the full set of calculators, not just whichever
  // ones happen to have recorded events yet.
  const TOOL_LABELS = {
    'horoscope': 'Daily / Weekly / Monthly Horoscope',
    'panchang': "Today's Panchang",
    'choghadiya': 'Choghadiya',
    'muhurat-finder': 'Muhurat Finder',
    'abhijit-muhurat': 'Abhijit Muhurat',
    'free-kundli': 'Free Kundli',
    'moon-sign': 'Moon Sign Calculator',
    'nakshatra-finder': 'Nakshatra Finder',
    'lucky': 'Lucky Color & Date',
    'baby-name': 'Baby Name Calculator',
    'lal-kitab': 'Lal Kitab',
    'kundli-matching': 'Kundli Matching',
    'flames': 'FLAMES',
    'mangal-dosha': 'Mangal Dosha',
    'kaal-sarp-dosha': 'Kaal Sarp Dosha',
    'sade-sati': 'Sade Sati',
    'rahu-ketu-transit': 'Rahu Ketu Transit',
    'numerology': 'My Numerology',
    'life-path-number': 'Life Path Number',
    'name-numerology': 'Name Numerology',
    'numerology-match': 'Numerology Match',
    'numerology-horoscope': 'Numerology Horoscope',
    'chinese-zodiac': 'Chinese Zodiac',
  };
  const TOOL_IDS = Object.keys(TOOL_LABELS);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderEvents(events) {
    const byType = new Map();
    for (const e of events) {
      if (!byType.has(e.event_type)) byType.set(e.event_type, []);
      byType.get(e.event_type).push(e);
    }

    // Calculator opens always list every calculator (0 if unused yet) —
    // everything else stays purely reactive to whatever's actually happened.
    const toolRows = byType.get('tool_open') || [];
    const toolTotals = new Map(toolRows.map(r => [r.event_label, r]));
    const fullToolRows = TOOL_IDS.map(id => toolTotals.get(id) || { event_label: id, total: '0' });
    byType.set('tool_open', fullToolRows.sort((a, b) => Number(b.total) - Number(a.total)));

    if (!events.length && !fullToolRows.some(r => Number(r.total) > 0)) {
      content.innerHTML = '<div class="empty">No events recorded yet.</div>';
      return;
    }
    const allTotals = [...events.map(e => Number(e.total)), ...fullToolRows.map(r => Number(r.total))];
    const maxTotal = Math.max(...allTotals);
    let html = '';
    // tool_open first (the full calculator list), then whatever other event
    // types actually occurred, in the order EVENT_TYPE_LABELS declares them.
    const typeOrder = ['tool_open', ...Object.keys(EVENT_TYPE_LABELS).filter(t => t !== 'tool_open')];
    for (const type of typeOrder) {
      const rows = byType.get(type);
      if (!rows || !rows.length) continue;
      html += `<div class="group"><h2>${EVENT_TYPE_LABELS[type] || type}</h2>`;
      for (const r of rows) {
        const pct = maxTotal ? Math.max(4, Math.round((Number(r.total) / maxTotal) * 100)) : 0;
        const label = type === 'tool_open' ? (TOOL_LABELS[r.event_label] || r.event_label) : r.event_label;
        html += `
          <div class="row">
            <span class="label">${escapeHtml(label)}</span>
            <span class="count">${r.total}</span>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
          </div>`;
      }
      html += '</div>';
    }
    content.innerHTML = html;
  }

  // Turns the flat (user, event_type, event_label, total) rows from the API
  // into { users: Map(email -> {name, phone, features: Map(featureKey -> count)}),
  //         featureKeys: [...], featureLabels: Map(featureKey -> display text) }.
  // Every calculator (TOOL_IDS) always gets its own column, 0 if that user
  // hasn't opened it — so the table always shows the full calculator list,
  // not just whichever ones happen to have been used already. Other features
  // (the wish-card flow) stay reactive: a column only appears once someone's
  // actually used it.
  function pivotByUser(byUser, allUsers) {
    const users = new Map();
    const featureKeys = [];
    const featureLabels = new Map();
    for (const id of TOOL_IDS) {
      const key = 'tool_open::' + id;
      featureKeys.push(key);
      featureLabels.set(key, 'Calculator: ' + TOOL_LABELS[id]);
    }
    // Seed every registered user first (0s across the board) — otherwise a
    // user who signed up but never triggered a tracked event (no calculator
    // opened, no wish-card action) simply never appears below, even though
    // they're a real registered user.
    for (const u of allUsers || []) {
      if (!users.has(u.email)) users.set(u.email, { name: u.name || '', phone: u.phone_number || '', features: new Map() });
    }
    for (const r of byUser) {
      if (!users.has(r.user_email)) users.set(r.user_email, { name: r.user_name || '', phone: r.user_phone || '', features: new Map() });
      const key = r.event_type + '::' + r.event_label;
      users.get(r.user_email).features.set(key, Number(r.total));
      if (!featureLabels.has(key)) {
        featureKeys.push(key);
        const typeLabel = EVENT_TYPE_LABELS[r.event_type] || r.event_type;
        featureLabels.set(key, typeLabel + ': ' + r.event_label);
      }
    }
    return { users, featureKeys, featureLabels };
  }

  let lastPivot = null;

  function renderUsers(byUser, allUsers) {
    const pivot = pivotByUser(byUser, allUsers);
    lastPivot = pivot;
    if (!pivot.users.size) {
      usersContent.innerHTML = '<div class="empty">No logged-in user activity recorded yet.</div>';
      return;
    }
    let html = '<div class="table-scroll"><table class="users"><thead><tr><th>Name</th><th>Email</th><th>Phone</th>';
    for (const key of pivot.featureKeys) html += `<th class="feature">${escapeHtml(pivot.featureLabels.get(key))}</th>`;
    html += '</tr></thead><tbody>';
    for (const [email, u] of pivot.users) {
      html += `<tr><td>${escapeHtml(u.name)}</td><td>${escapeHtml(email)}</td><td>${escapeHtml(u.phone)}</td>`;
      for (const key of pivot.featureKeys) html += `<td class="feature">${u.features.get(key) || 0}</td>`;
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    usersContent.innerHTML = html;
  }

  function downloadCsv() {
    if (!lastPivot || !lastPivot.users.size) return;
    const header = ['Name', 'Email', 'Phone', ...lastPivot.featureKeys.map(k => lastPivot.featureLabels.get(k))];
    const csvEscape = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [header.map(csvEscape).join(',')];
    for (const [email, u] of lastPivot.users) {
      const row = [u.name, email, u.phone, ...lastPivot.featureKeys.map(k => u.features.get(k) || 0)];
      lines.push(row.map(csvEscape).join(','));
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'campaign-analytics-users.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function loadSummary(username, password) {
    const res = await fetch(`${API_BASE}/api/campaign-analytics/summary`, { headers: { 'x-analytics-username': username, 'x-analytics-password': password } });
    if (res.status === 401) throw new Error('unauthorized');
    if (!res.ok) throw new Error('failed');
    return res.json();
  }

  async function tryUnlock(username, password) {
    gateError.textContent = '';
    try {
      const data = await loadSummary(username, password);
      storeCredentials(username, password);
      gate.hidden = true;
      dashboard.hidden = false;
      renderEvents(data.events);
      renderUsers(data.byUser || [], data.users || []);
    } catch (err) {
      gateError.textContent = err.message === 'unauthorized' ? 'Incorrect ID or password.' : 'Could not load data — check the backend is running.';
    }
  }

  document.getElementById('toggle-password').addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    document.getElementById('toggle-password').textContent = showing ? '👁' : '🙈';
    document.getElementById('toggle-password').setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  document.getElementById('unlock').addEventListener('click', () => tryUnlock(usernameInput.value, passwordInput.value));
  for (const el of [usernameInput, passwordInput]) {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(usernameInput.value, passwordInput.value); });
  }

  document.getElementById('refresh').addEventListener('click', async () => {
    actionError.textContent = '';
    try {
      const { username, password } = getStoredCredentials();
      const data = await loadSummary(username, password);
      renderEvents(data.events);
      renderUsers(data.byUser || [], data.users || []);
    } catch { /* credentials expired mid-session — ignore, next full load will re-gate */ }
  });

  document.getElementById('download-csv').addEventListener('click', downloadCsv);

  document.getElementById('reset').addEventListener('click', async () => {
    actionError.textContent = '';
    if (!confirm('Are you sure you want to reset? This will permanently delete ALL recorded analytics data — this cannot be undone.')) return;
    try {
      const { username, password } = getStoredCredentials();
      const res = await fetch(`${API_BASE}/api/campaign-analytics/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) throw new Error('failed');
      const data = await loadSummary(username, password);
      renderEvents(data.events);
      renderUsers(data.byUser || [], data.users || []);
    } catch {
      actionError.textContent = 'Could not reset data — please try again.';
    }
  });

  const stored = getStoredCredentials();
  if (stored.username && stored.password) tryUnlock(stored.username, stored.password);
</script>
</body>
</html>
