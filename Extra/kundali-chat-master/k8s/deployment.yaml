# Single process type — the API also runs the in-process Redis Streams
# worker pool + reaper via its lifespan (see src/kundali_chat/api/app.py).
# No Kafka dependency.
#
# The wait-for-postgres/wait-for-redis init containers assume Postgres and
# Redis are reachable at the hostnames "postgres" / "redis" in this
# namespace — update them to match wherever you actually run those (a
# managed DB, a different service name, etc.).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kundali-chat
  namespace: kundali-chat
  labels:
    app.kubernetes.io/name: kundali-chat
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kundali-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kundali-chat
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo 'waiting for postgres'; sleep 2; done"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis 6379; do echo 'waiting for redis'; sleep 2; done"
      containers:
        - name: api
          image: kundali-chat:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "kundali_chat.entrypoints.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kundali-chat-config
            - secretRef:
                name: kundali-chat-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
