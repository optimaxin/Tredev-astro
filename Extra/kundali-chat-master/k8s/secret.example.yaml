# Template only. Tracked in git so the shape of `kundali-chat-secrets` is
# documented. The real Secret must be applied OUT-OF-BAND (never committed).
#
# Recommended for local kind testing:
#
#   kubectl create secret generic kundali-chat-secrets -n kundali-chat \
#     --from-literal=POSTGRES__DSN='postgresql://kundali_chat:REPLACE_ME@postgres:5432/kundali_chat' \
#     --from-literal=REDIS__URL='redis://redis:6379/0' \
#     --from-literal=LLM__GEMINI_API_KEY='REPLACE_ME' \
#     --from-literal=LLM__SARVAM_API_KEY='' \
#     --from-literal=KUNDALI_API__API_KEY=''
#
# For staging / prod, switch to external-secrets-operator or
# `kubectl create secret generic ... --from-env-file=` with a sealed env file.
apiVersion: v1
kind: Secret
metadata:
  name: kundali-chat-secrets
  namespace: kundali-chat
type: Opaque
stringData:
  POSTGRES__DSN: "postgresql://kundali_chat:REPLACE_ME@postgres:5432/kundali_chat"
  REDIS__URL: "redis://redis:6379/0"

  # Only one of these needs a real value, matching LLM__PROVIDER in configmap.yaml.
  LLM__GEMINI_API_KEY: "REPLACE_ME"
  LLM__SARVAM_API_KEY: ""

  KUNDALI_API__API_KEY: ""
