[project]
name = "kundali-chat"
version = "0.1.0"
description = "LLM-powered Vedic-astrologer chat for the free Kundali generator result page."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "redis>=5.2",
  "langgraph>=0.2",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pyright>=1.1.391",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-randomly>=3.16",
  "testcontainers[postgres,redis]>=4.9",
  # Sync PG driver — only used by tests/integration/test_migrations.py via
  # SQLAlchemy create_engine. The runtime path uses asyncpg.
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.12"
# "standard" plus surgical strictness — strict fights async-library stubs.
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
strictParameterNoneValue = true
# LangGraph state TypedDicts use total=False so each node returns a partial
# update — but downstream nodes always see the upstream-set keys.
reportTypedDictNotRequiredAccess = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kundali_chat",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=80",
]
markers = [
  "integration: tests that require testcontainers (slow)",
  "live: tests that hit real external services (cost-guarded, opt-in)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["src/kundali_chat"]
# entrypoints/* are exercised end-to-end at startup, not unit-covered.
omit = ["src/kundali_chat/entrypoints/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
